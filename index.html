<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ContentGen-AI — Smart Content Generation Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">✏️ ContentGen-AI</div>
    <p class="tagline">Generate professional content in seconds</p>
  </header>

  <main class="container">
    <section class="controls-panel">
      <div class="input-group">
        <label for="topic">Topic / Subject</label>
        <input type="text" id="topic" placeholder="e.g. Artificial Intelligence in Healthcare" />
      </div>

      <div class="input-group">
        <label for="contentType">Content Type</label>
        <select id="contentType">
          <option value="blog">📝 Blog Post</option>
          <option value="tweet">🐦 Tweet Thread</option>
          <option value="email">📧 Marketing Email</option>
          <option value="product">🛒 Product Description</option>
          <option value="readme">📂 README.md</option>
        </select>
      </div>

      <div class="input-group">
        <label for="industry">Industry / Niche</label>
        <select id="industry">
          <option value="general">General</option>
          <option value="tech">Technology</option>
          <option value="health">Healthcare</option>
          <option value="finance">Finance</option>
          <option value="ecommerce">E-Commerce</option>
          <option value="education">Education</option>
          <option value="fitness">Fitness & Wellness</option>
          <option value="food">Food & Beverage</option>
        </select>
      </div>

      <div class="input-group">
        <label for="tone">Tone</label>
        <select id="tone">
          <option value="professional">Professional</option>
          <option value="casual">Casual</option>
          <option value="witty">Witty</option>
          <option value="persuasive">Persuasive</option>
          <option value="informative">Informative</option>
        </select>
      </div>

      <button id="generateBtn" class="btn-primary">🚀 Generate Content</button>
    </section>

    <section class="output-panel">
      <div class="output-toolbar">
        <div class="stats">
          <span id="wordCount">0 words</span>
          <span class="sep">•</span>
          <span id="readTime">0 min read</span>
          <span class="sep">•</span>
          <span id="charCount">0 chars</span>
        </div>
        <div class="actions">
          <button id="copyBtn" class="btn-secondary" title="Copy to clipboard">📋 Copy</button>
          <button id="exportBtn" class="btn-secondary" title="Export as .md file">💾 Export .md</button>
        </div>
      </div>
      <div id="output" class="output-content">
        <div class="placeholder">
          <span class="placeholder-icon">✨</span>
          <p>Your generated content will appear here.<br>Enter a topic and hit Generate!</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>ContentGen-AI — Content templates powered by smart randomization</p>
  </footer>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
