<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContentGen AI — Content Generation Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="logo">
            <span class="logo-icon">✍️</span>
            <h1>ContentGen AI</h1>
        </div>
        <div class="topbar-right">
            <span class="ai-badge">Powered by MiMo V2.5</span>
        </div>
    </header>

    <main class="workspace">
        <div class="editor-section">
            <div class="format-tabs">
                <button class="tab active" data-format="blog">📝 Blog Post</button>
                <button class="tab" data-format="social">🐦 Social Media</button>
                <button class="tab" data-format="email">📧 Email</button>
                <button class="tab" data-format="ad">📢 Ad Copy</button>
                <button class="tab" data-format="tech">💻 Technical</button>
            </div>

            <div class="editor-toolbar">
                <div class="topic-input">
                    <label>Topic / Brief</label>
                    <input type="text" id="topicInput" placeholder="Enter your topic or brief description..." value="How AI agents are transforming software development">
                </div>
                <div class="tone-select">
                    <label>Tone</label>
                    <select id="toneSelect">
                        <option value="professional">Professional</option>
                        <option value="casual">Casual</option>
                        <option value="witty">Witty</option>
                        <option value="formal">Formal</option>
                        <option value="persuasive">Persuasive</option>
                    </select>
                </div>
                <div class="length-select">
                    <label>Length</label>
                    <select id="lengthSelect">
                        <option value="short">Short</option>
                        <option value="medium" selected>Medium</option>
                        <option value="long">Long</option>
                    </select>
                </div>
                <button class="btn-generate" id="generateBtn">✨ Generate</button>
            </div>

            <div class="editor-area">
                <div class="editor-gutter" id="lineNumbers"></div>
                <textarea id="editor" placeholder="Your generated content will appear here..." spellcheck="false"></textarea>
            </div>

            <div class="editor-footer">
                <div class="word-count">
                    <span id="wordCount">0</span> words · <span id="charCount">0</span> characters · <span id="readTime">0 min read</span>
                </div>
                <div class="footer-actions">
                    <button class="btn-action" id="copyBtn">📋 Copy</button>
                    <button class="btn-action" id="clearBtn">🗑 Clear</button>
                    <button class="btn-action" id="exportBtn">💾 Export .md</button>
                </div>
            </div>
        </div>

        <aside class="suggestion-panel">
            <div class="panel-header">
                <h3>🤖 AI Suggestions</h3>
            </div>

            <div class="suggestion-actions">
                <button class="sug-btn" id="rephraseBtn">🔄 Rephrase</button>
                <button class="sug-btn" id="expandBtn">📐 Expand</button>
                <button class="sug-btn" id="summarizeBtn">📏 Summarize</button>
                <button class="sug-btn" id="improveBtn">⬆ Improve</button>
            </div>

            <div class="ai-output" id="aiOutput">
                <div class="ai-placeholder">Select an action to get AI suggestions on your content.</div>
            </div>

            <div class="templates-section">
                <h4>Quick Templates</h4>
                <div class="template-list">
                    <button class="template-btn" data-template="intro">🎯 Engaging Introduction</button>
                    <button class="template-btn" data-template="cta">📣 Call to Action</button>
                    <button class="template-btn" data-template="conclusion">🏁 Strong Conclusion</button>
                    <button class="template-btn" data-template="hook">🪝 Attention Hook</button>
                    <button class="template-btn" data-template="listicle">📋 Listicle Section</button>
                </div>
            </div>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
